# kgsm-dns — the site this anchor generates for its own names, included into the web server.
#
# The anchor writes /var/lib/kgsm/nginx/kgsm-dns.conf from a fixed template: a name, its certificate,
# and this component's proxy rules from /etc/nginx/kgsm/kgsm-dns.locations. A name appears there only
# once its certificate exists. The pattern matches that one file and nothing else, and matching
# nothing is not an error, so the web server loads cleanly before the anchor has written anything.
include /var/lib/kgsm/nginx/kgsm-dns*.conf;
